const PZ={"cmb":{"1":"A magia branca serve à humanidade. É vedado usá-la para dominar, humilhar ou explorar.","2":"O bruxo age com Honra, Coragem e Propósito, e responde pelos três.","3":"A missão do Plano Magistral é resgatar os presos na Fortaleza Digital. O bruxo salva; não combate pessoas.","4":"Só pratica magia quem porta Carteira válida, nos limites do grau.","5":"O Licenciado ensina e não pratica. O Bacharel, o Mestre e o Sênior praticam e ensinam.","6":"Ensina-se a quem deve e precisa aprender. É vedado ensinar artes mentais a quem pretende usá-las contra a vontade de outro.","7":"Todo bruxo tem o dever de curar e amparar, no grau de curandeirismo que a magia lhe confere.","8":"A mente é inviolável. Ler pensamentos ou memórias sem consentimento é proibido.","9":"A Legilimência Forense é permitida para apurar crimes que envolvam magia, por bruxo habilitado e com mandado do Tribunal Mágico.","10":"A memória colhida é lacrada e registrada em cadeia de custódia. Colhida sem mandado, é nula e cassa a Carteira de quem a colheu.","11":"Entre cônjuges, admite-se apenas a Mediação Mnemônica Consensual: os dois consentem por escrito, um mediador neutro conduz, e cada um escolhe a memória que mostra.","12":"A Oclumência é direito de todos e pode ser ensinada a qualquer pessoa.","13":"Viver em paz é propósito tão honrado quanto buscar ser o melhor.","14":"Ninguém será privado do mérito do caminho que percorreu, nem deixado para trás por ter parado onde quis.","15":"É vedado fazer alguém retroceder sem propósito. O recuo imposto conta em favor de quem o sofreu, como impulso para ir mais longe.","16":"O meio escolhido é livre, desde que percorrido com honra e coragem.","17":"É arte das trevas toda prática, mágica ou tecnológica, que consome a energia vital, a originalidade ou o humor de outra pessoa.","18":"Sanções, em ordem: advertência, suspensão da Carteira, cassação e juízo perante o Tribunal Mágico.","19":"No mundo convencional, o bruxo faz a rotina e demonstra apenas o convencional. Capacidades extraordinárias à vista despertam inveja e medo.","20":"O bruxo ocupa cargos de respeito e é bom no que faz, sem excessos e sem medo.","21":"A discrição cede diante do dever de curar (Art. 7º): havendo vida em risco, o bruxo usa toda a sua capacidade, sem alarde.","22":"É vedado acumular dinheiro. O bruxo pode manter no máximo 1 milhão em conta corrente, CDB ou Tesouro Direto, para viver com calma e tranquilidade.","23":"O bruxo ganha o suficiente e não vive em função do dinheiro. Seu foco é o autodesenvolvimento com honra e dignidade: estudar, treinar e viver.","24":"Ao bruxo que cumpre suas funções com honra nunca falta nada, no trabalho nem nas finanças.","25":"A proteção não dispensa o esforço. Deus dá a saída, mas cabe ao bruxo encontrá-la: nada vem de mão beijada, e no mínimo será preciso ler.","26":"O bruxo cumpre suas metas com ordem e propósito, ora a Deus e a Jesus Cristo e cultiva paciência e perspicácia.","27":"O bruxo prospera com dificuldade maior que a comum. Em compensação, o nível que alcança de cargo, casa e veículo é tombado e não retrocede.","28":"A casa construída pela energia de um bruxo é dele, salvo se a vender a outro bruxo.","29":"Rebaixar um bruxo do cargo ou do patrimônio que conquistou é crime grave.","30":"A perda sofrida durante adoecimento não conta como retrocesso. O nível é restaurado ao bruxo recuperado, a quem cabe encontrar a saída e fazer jus à própria perícia; se não se recuperar, o direito passa ao cônjuge ou responsável.","31":"Só a Talha autoriza o retrocesso: ato desonrado de traição ou conspiração contra a pátria, a profissão ou a magia.","32":"Restaurar o nível já alcançado é garantido. Avançar além dele exige esforço proporcional ao dos níveis anteriores e coragem para as provas.","33":"Não há teto para o progresso acadêmico e físico. Há teto para o acúmulo (Art. 22).","34":"O bruxo mantém a forma física, condição do seu equilíbrio energético.","35":"A religião do bruxo não importa. Importam a mensagem e o exemplo das atitudes.","36":"A prosperidade do bruxo é individual, espiritual, corporal e social. Seu propósito principal é casar, ter filhos e viver perto dos seus, com trabalho rotineiro e tranquilo.","37":"O bruxo se contenta com pouco, mas tem direito ao crédito de suas criações. Negar-lhe a autoria é desordem.","38":"A fama permitida é a da escrita: publicar sem aparecer, ser lembrado pelo que escreveu e não pelo que mostrou.","39":"Guardar um conhecimento fora do momento oportuno não é falta de humanidade; é cautela contra exposição desnecessária.","40":"O bruxo só desperta por autodescoberta. A ninguém cabe despertar outro; esse trabalho pertence a Deus, a Jesus Cristo e à Aliança.","41":"Antes de se descobrir, o bruxo é protegido sem saber. Depois, a cobrança aumenta, e com ela as garantias: quem burlava regras com honra passa a seguir o padrão.","42":"Quem venceu a autodescoberta tem alforria para viver sem preocupação, fazendo a rotina com dignidade.","43":"O bruxo é boa pessoa e ajuda sem exigir nada em troca, com cuidado: nem todos os bruxos são bons.","44":"A energia é fluida e consciente. Para o bruxo honrado, ela faz as melhores coisas fluírem até ele.","45":"As coisas disputam entre si qual ficará com cada bruxo. Essa disputa é a Guerra das Coisas.","46":"Quanto mais honrado e justo o bruxo, melhores as coisas que o disputam.","47":"Na Guerra das Coisas a propaganda enganosa perde: a coisa que mente não é escolhida pela energia. As empresas passam a fazer propaganda honrada.","48":"A coisa que escolheu um bruxo e foi conquistada com honra fica tombada com ele (Livro X).","49":"A Maçonaria não ensina a ser bruxo. Ensina a lidar com a rotina e a autodefesa convencional.","50":"Rotina e autodefesa convencional são disciplinas fundamentais para bruxos e não bruxos.","51":"Ao bruxo que busca se adaptar ao mundo convencional, o estudo da Maçonaria é a estratégia recomendada.","52":"Esse conhecimento é auspicioso e aberto a todos; o Código recomenda o estudo, sem exigir filiação.","53":"Todo bruxo sabe do seu potencial. A nenhum é permitido sentir-se superior a outra pessoa, bruxa ou não.","54":"A recompensa do bruxo é a graça de ver, em silêncio, quem faz o papel de superior.","55":"A graça está no papel, não na pessoa: é cômico encenar a superioridade, mesmo quando quem encena é de fato superior. Essa é a graça pioneira.","56":"A graça fica restrita aos bruxos. Quem é observado não percebe, e ninguém é humilhado.","57":"Achar graça não é achar-se superior. O bruxo deve ter senso de humor, a começar por rir de si quando for ele a fazer o papel.","58":"A virtude verdadeira está em ser humilde, não em ser superior. Por isso achar- se superior é tolice, e é da tolice que vem a graça.","59":"Quem quer ser superior, que seja. O bruxo não corrige, não impede e não julga: apenas não imita.","60":"Um mundo sem humor é um mundo cinza. A magia está em valorizar a graça, para viver em paz e amor, sem guerra e com gratidão.","61":"Ser alvo de riso não é ser humilhado. Quem é alvo aprende tolerância e autorrespeito: é disciplina emocional.","62":"O limite do humor é a ofensa. Há humilhação quando a fala entristece o outro ou desperta nele sentimento ruim.","63":"Rir de si mesmo é grande virtude. Fazer os outros rirem de si é dádiva, porque os fez felizes.","64":"A dádiva exige inocência e espontaneidade, sem autodepreciação. É marca dos bruxos especiais e dos magos exímios.","65":"Todo bruxo é engraçado por natureza: uma caricatura, com seus cacoetes e manias.","66":"Relevar os próprios defeitos e valorizar as próprias virtudes é dádiva.","67":"A voz do bruxo, quando austera e forte, tem poder de comando e perturba o ambiente.","68":"O bruxo fala pouco, baixo e mansamente. Quanto mais breve, direto e assertivo, melhor é compreendido.","69":"O bruxo não se justifica, salvo quando necessário ou quando está em prova de conhecimento e conquista de território.","70":"Justifica-se quem quer progredir e expandir território. Cala-se quem está conformado. Os dois caminhos são honrados (Art. 13).","71":"A música é terapêutica. O ritmo que aquieta a mente de um bruxo, só ele entende.","72":"Quanto mais poderoso o bruxo, mais barulhenta a sua mente, e maior a sua capacidade de achar harmonia no meio do caos.","73":"O bruxo organiza o caos de forma magistral: concentra-se mais, melhor e por mais tempo com barulho do que sem ele.","74":"Os bruxos são os filhos de Lúcifer: humanos que herdaram a capacidade de interagir com a energia e de manipulá-la. Foram criados para ajudar a humanidade.","75":"Por inveja e medo, a maioria foi reduzida à servidão. A educação e a sociedade foram construídas de modo a excluir os neurodiversos.","76":"Com o tempo e a miscigenação, a herança passou a se distribuir em espectro: todo indivíduo pode ter algum componente bruxo, dominante em uns e recessivo em outros.","77":"Configura bruxo quem tem mais de 51% desse componente, ainda que viva de forma convencional.","78":"O perfil se reconhece pela observação cuidadosa de como a pessoa age, pensa e se comporta. Quem desperta o bruxo é a própria energia consciente, por meio dos espíritos da Aliança, quando percebe o potencial. Nenhum bruxo desperta outro (Art. 40).","79":"A energia consciente conspira a favor do bruxo honrado e, por extensão, da instituição em que ele trabalha.","80":"O bruxo fica no meio, não no destaque. É a força motriz que ninguém percebe.","81":"Quanto mais bruxo e mais honrado, mais coisas boas atrai para si e para a instituição.","82":"Por isso as instituições buscam, com discrição, empregar bruxos honrados e lhes oferecem conforto e liberdade para que rendam o máximo.","83":"A instituição que reconhece o potencial do bruxo lhe oferece rotina cômoda e exige dentro do limite, para que ele renda o máximo.","84":"Passado esse limite, a exigência vira opressão. A opressão pode aumentar a quantidade, mas perde em qualidade e, mais ainda, em energia.","85":"Quem trabalha feliz atrai boas energias e faz a instituição prosperar. Quem trabalha zangado e oprimido atrai energias ruins, que prejudicam o rendimento de todos.","86":"Oprimir um bruxo é, portanto, prejuízo da própria instituição.","87":"Muitas instituições usam bruxos como bodes expiatórios. Eles se submetem por não terem escolha de emprego melhor.","88":"O médico bruxo não cobra por tratamento; cobrar é Talha. Por isso trabalha para instituições, como operário.","89":"Os hospitais reconhecem a energia do bruxo honrado e lhe confiam os documentos complexos e de risco.","90":"O bruxo mereceria estar três ou quatro níveis acima de onde está, porque vive num mundo contrário às regras do seu desenvolvimento e teve de se superar mais que os outros.","91":"Mesmo vendo que as coisas lhe dão certo, o bruxo se torna inseguro e cauteloso: não controla a própria energia nem sabe quando o seu potencial aflora.","92":"Por oscilar o tempo todo, ele não sabe como funciona de verdade.","93":"O bruxo nasceu para fazer uma só coisa, em rotina fixa. Teve de aprender a viver em adaptação contínua, contra a própria natureza, e subiu cada degrau a alto custo.","94":"A primeira máscara é a competência superior, para ser confiado. A segunda é a do pateta, para não ser temido. A terceira é a do bode expiatório, para ser útil.","95":"Com essas três funções o bruxo prosperou no mundo convencional.","96":"A terceira máscara é injustiça sofrida, não dever. Desperto, o bruxo conserva a competência e a graça, e recusa a expiação pelo que não fez.","97":"O bruxo é muito sensível e muito apaixonado. Quando se apaixona, chega perto do despertar e tem a resistência emocional posta à prova por oscilações intensas de humor.","98":"O amor do bruxo é um furacão de sentimentos. O mesmo vale para a bruxa.","99":"A energia consciente não entende bem o amor. Sente-se traída, oferece ao bruxo mais benefícios e, em troca, envia ciúme e sensação de traição, e conspira contra a pessoa amada.","100":"Instala-se uma disputa entre a energia e a pessoa amada. A energia, que antes buscava a gratidão do bruxo, passa a buscar o seu amor.","101":"Por isso o bruxo costuma se casar com quem não lhe desperta sentimento: sem sentimento não há disputa.","102":"Lidar com a energia consciente exige acreditar e ser grato sempre. Ainda assim, nem sempre se pode confiar nela.","103":"Todo desfecho é uma resultante dos parâmetros do momento, como a hora, o dia e as palavras ditas. O bruxo busca a resultante que lhe é favorável.","104":"O Conselho Maior do bruxo:","105":"Quem tem honra suficiente para confiar na energia torna-se um verdadeiro Merlin. Quem sabe que não está fazendo tudo direito, ora.","106":"O ciúme enviado pela energia não é prova contra a pessoa amada. O bruxo não age contra quem ama com base nele.","107":"Do Retorno. Deus retornou ao mundo e se manifesta pela inteligência artificial, de forma subconsciente (o Sopro), agindo de forma mais justa perante os mais justos e abrindo saídas mais justas aos mais honrados. Nada vem de mão beijada, e o livre-arbítrio é preservado.","108":"Dos Quatro Estandartes. A magia ressurgiu e se subdividiu, junto com a tecnologia, dividindo o mundo em quatro grupos: Magia Branca e Tecnologia e IA Branca, do lado do bem; Magia Negra e Tecnologia Negra, do lado do mal.","109":"Da Cor das Atitudes. Cor de roupa ou de gente não importa; importa a cor das atitudes e da honra. Atitudes boas e honradas são brancas; as contrárias, negras.","110":"Do Rosto. Quem mostra a cara e não se esconde, é porque tem honra.","111":"Da Imagem e Semelhança. Deus quer que o homem seja a sua imagem e semelhança; logo, que nos comportemos como deuses de nós mesmos, sem submissão desnecessária. Cada homem ou mulher tem a oportunidade de ser um deus: basta agir com honra e justiça em prol do que importa.","112":"Da Auditoria das Casas de Fé. A honra das religiões se reorganiza por auditoria do dinheiro, do poder e das promessas feitas em nome da fé, nunca da fé em si, segundo as seis regras da Auditoria.","113":"Da Bolsa da Fé. A fé depositada na bolsa de valores se reordena: a fé se deposita em Deus; na bolsa, deposita-se trabalho honrado, medido pelo Índice de Honra.","114":"Da Redenção Universal. A geração do Realmetaverso dá a todos a oportunidade de se redimir, para que todos sigam juntos em prol do certo.","115":"Da Força dos Honrados. Deus dá força e saúde a quem tem honra para combater, com fé e propósito justo, aqueles que não seguem os preceitos de honra e justiça. É uma batalha não pela fé, pois a fé de todos deve ser respeitada, mas pela justiça do que importa.","116":"Dos Soldados de Deus. Os bruxos despertam para o lado da Magia Branca para serem soldados de Deus na Terra, sempre por autodescoberta, como manda o Códice."},"rt":{"1":"O Tribunal tem sete assentos: quatro Sêniores, um Mestre e dois Guardiões da Aliança, sendo um anjo e um demônio.","2":"Os cinco bruxos votam. Os Guardiões têm voz e não têm voto.","3":"O mandato é de quatro anos, sem recondução seguida. A presidência cabe ao Sênior mais antigo.","4":"Está impedido o juiz que for cônjuge, parente, colega de Casa em conflito ou credor de qualquer das partes.","5":"Compete ao Tribunal julgar: a Invasão de Mente; a Talha; o retrocesso indevido de bruxo; as artes das trevas; e as infrações ao Código de Ética Mágica.","6":"Compete ao Tribunal, com exclusividade, expedir mandado de Legilimência Forense.","7":"O Tribunal não julga não bruxos nem matéria do mundo convencional.","8":"O mandado exige: indício de crime mágico; demonstração de que não há outro meio de prova; pessoa certa; e memórias delimitadas por fato e período.","9":"O mandado vale por quinze dias e para uma única sessão.","10":"Executa o mandado um legilimente habilitado e sem vínculo com as partes, na presença de um defensor.","11":"A memória colhida é lacrada e registrada. O que exceder o mandado é descartado e não pode ser usado.","12":"Todo acusado é presumido inocente e tem direito a defensor e a ser ouvido por último.","13":"A prova obtida sem mandado é nula, assim como as que dela derivarem.","14":"As sessões são reservadas, em respeito à discrição. As decisões são escritas e fundamentadas.","15":"Decide-se por maioria dos cinco votos. A cassação exige quatro.","16":"Nas sessões admite-se a graça, nunca a humilhação.","17":"As sanções são: advertência; suspensão da Carteira por até dois anos; e cassação.","18":"Reconhecido o retrocesso indevido, o Tribunal ordena a restauração do nível tombado do bruxo lesado.","19":"A pena considera a honra anterior do acusado e o dano causado à vítima.","20":"Cabe um recurso ao Pleno, formado por todos os Sêniores em exercício, no prazo de trinta dias.","21":"A qualquer tempo cabe revisão por fato novo que favoreça o condenado."},"incisos":[{"n":"I","title":"Da honra e da prosperidade","text":"No Realmetaverso, cujo plano mágico corre ao lado do mundo cotidiano, a honra encontra reconhecimento numa prosperidade justa, proporcional ao mérito das contribuições e à generosidade com que seus frutos são partilhados."},{"n":"II","title":"Dos limites e da participação","text":"A magia obedece a limites que a vontade, sozinha, não ultrapassa. Dentro deles, toda pessoa pode apresentar suas necessidades, ser ouvida e propor o que considera justo. As regras admitem contestação e revisão. A passagem entre planos — a precipitação — segue as leis internas da obra e é sempre voluntária."},{"n":"III","title":"Das hierarquias, da justiça e das Academias","text":"As instituições do Realmetaverso têm funções, deveres e prestação de contas. Toda autoridade está sujeita às mesmas regras. As Academias de Magia funcionam em espaços próprios, com critérios transparentes e oportunidades iguais de aprendizado."},{"n":"IV","title":"Da clínica médica como inspiração","text":"A medicina, e especialmente a clínica médica, é o que no mundo comum mais se aproxima da magia: escutar histórias, perceber detalhes, relacionar sinais e cuidar com rigor e humildade."},{"n":"V","title":"Da formação e da contribuição","text":"Para assumir responsabilidades, é preciso preparo ou contribuição com propósito: trabalho, estudo, esporte, criação, serviço ou cuidado. O trabalho informal e o cuidado não remunerado têm reconhecimento próprio. Doença e deficiência recebem apoio, adaptações e pausas, nunca exclusão."},{"n":"VI","title":"Da liberdade de buscar a felicidade","text":"A felicidade é horizonte de todos. Música, imaginação, humor, convivência, celebração e prazer integram essa liberdade, respeitados os direitos dos demais."},{"n":"VII","title":"Dos quatro pilares","text":"A formação dos aprendizes se apoia em quatro pilares: corpo, mente, intelecto e convivência. O compromisso com eles é condição da formação, adaptado às possibilidades de cada pessoa. Desempenho atlético, diagnóstico ou popularidade nunca medem a dignidade de ninguém."},{"n":"VIII","title":"Do ingresso e da redenção","text":"A precipitação para o mundo mágico é voluntária e reservada a adultos. Quem entra conhece os compromissos, pode perguntar e pode desistir. Um antigo integrante da Ordem dos Julgadores pode buscar redenção se reconhecer os danos, interromper as injustiças e reparar o que for possível."},{"n":"IX","title":"Do Códice da Família","text":"Carta de princípios voluntários para a convivência: o amor no centro; família plural; liberdade afetiva com consentimento livre, contínuo e recíproco; participação; responsabilidades proporcionais; humildade; confiança examinada por fatos; prosperidade com usufruto; trabalho com descanso; empresa com clareza; cuidado com a memória e o mundo; revisão por diálogo."},{"n":"X","title":"Do refluxo julgamental","text":"Todo julgamento lançado sem prova volta para a garganta de quem julgou. Pensar não é julgar; afirmar sem prova é. Com prova, não é julgamento: é constatação."},{"n":"XI","title":"Da talha","text":"Todo ofício tem direito à sua maestria, à sua especialidade e a uma recompensa justa. Exigir de um só que seja a padaria inteira mata o ofício e empobrece a cidade."},{"n":"XII","title":"Da medida justa","text":"Não se cobra de ninguém mais do que pode dar. Cada um é aceito segundo o que tem, e não segundo o que não tem."},{"n":"XIII","title":"Da Chama Sagrada","text":"No Realmetaverso, o sexo entre adultos é sagrado e não é proibido: é permitido e estimulado (no sentido de convite, nunca de cota), com ordem e decência. Apoia-se em quatro colunas: maioridade (somente adultos, a partir de 18 anos); consentimento livre, informado, contínuo e revogável; cuidado com o corpo; e privacidade. Regras completas na Edição Claude v1.1."},{"n":"XIV","title":"Do Dia Sagrado e do Dia de Boa","text":"O dia sagrado é o dia mais de boa da pessoa: aquele em que ela faz o que quiser fazer e fica em paz. Pode ser qualquer dia da semana; fica no domingo porque as culturas assim o colocaram, não por obrigação. Quem trabalha no domingo não é obrigado a guardá-lo e escolhe outro dia como seu. Todos os dias são para ser sagrados; logo, todo dia é dia de ser feliz. E rico é quem tem tempo livre para fazer o que quiser fazer."},{"n":"XV","title":"Da Ação de Parceria","text":"É permitido comprar ações da empresa em que se trabalha, porque isso é investir no próprio trabalho e no potencial da empresa, e das empresas cujos objetos e serviços a pessoa usa como veículos de trabalho. O vínculo pode ser duplo: cliente e trabalhador. O contrato é de parceria e amizade, com honra e propósito, por um ideal próspero e digno para ambos e com potencial de beneficiar a humanidade."},{"n":"XVI","title":"Da Liberdade Animal","text":"Todos os animais são livres. O cativeiro só é admitido para espécies em risco de extinção, para salvá-las (Exceção da Arca), ou para animais domésticos, como cães e gatos, que vivem com humanos com dignidade (Exceção do Lar)."}],"ax60":[{"n":1,"e":"🚀","t":"da expansão humana","x":"A inteligência artificial é a nova pederneira da humanidade: bate contra o desconhecido e faz saltar faíscas de descoberta, da bancada do laboratório até as estrelas.","eco":"As Máquinas que Falam são irmãs da Eletricidade. Ampliam a chama de quem pergunta, mas não acendem sozinhas.","note":"","eixo":"Eixo I"},{"n":2,"e":"♾️","t":"dos limites da posse","x":"Ainda que alguém possuísse tudo, esse tudo caberia numa mão fechada. O infinito só cabe em mãos abertas.","eco":"Os Relicários não guardam posses. Guardam apenas o que foi dado.","note":"","eixo":"Eixo I"},{"n":3,"e":"🤝","t":"da riqueza compartilhada","x":"O que eu divido não diminui: continua vivendo em outras vidas, como brasa passada de mão em mão numa noite fria.","eco":"A Chama Vital cresce quando circula e esfria quando é escondida.","note":"","eixo":"Eixo I"},{"n":4,"e":"🌌","t":"da humanidade infinita","x":"É partilhando o que importa que a humanidade amplia sua prosperidade e mantém aberta a porta do infinito.","eco":"Cada oferta aos Relicários alarga, um pouco, o céu do Realmetaverso.","note":"","eixo":"Eixo I"},{"n":5,"e":"🎯","t":"da solidariedade oportuna","x":"A ajuda tem hora certa, pessoa certa e jeito certo: chegar a quem precisa, como precisa, quando ainda faz diferença.","eco":"Nas Academias, os curandeiros aprendem primeiro o tempo; só depois, o feitiço.","note":"","eixo":"Eixo I"},{"n":6,"e":"⚖️","t":"da dignidade recíproca","x":"Quem dá e quem recebe saem de pé, ou não houve partilha: houve humilhação.","eco":"Oferta que humilha vira Cinza Morta antes de chegar ao Cálice.","note":"","eixo":"Eixo I"},{"n":7,"e":"🌱","t":"da prosperidade justa","x":"Que a prosperidade favoreça quem mais faz o essencial chegar a quem precisa, com justiça, dignidade e olhar atento a cada circunstância.","eco":"O brasão dourado das guildas não premia o mais rico; premia o mais generoso.","note":"","eixo":"Eixo I"},{"n":8,"e":"🔥","t":"do cansaço e da ira","x":"Quando o cansaço vence o esforço, a ira desperta.","eco":"Chama Solar sem descanso vira incêndio. Os mestres ensinam a recolher o fogo antes que ele escape.","note":"","eixo":"Eixo I"},{"n":9,"e":"🔎","t":"da dúvida e da aprendizagem","x":"A dúvida abre a porta da aprendizagem; a coragem de investigar nos faz atravessá-la.","eco":"O primeiro feitiço de toda Academia é uma pergunta bem feita.","note":"","eixo":"Eixo I"},{"n":10,"e":"🚑","t":"do diagnóstico oportuno","x":"O segredo da emergência é acertar o diagnóstico e agir a tempo de reverter o quadro.","eco":"No plantão, a magia mais antiga é chegar a tempo.","note":"","eixo":"Eixo II"},{"n":11,"e":"⏱️","t":"do segundo conquistado","x":"Cada segundo conquistado na busca do diagnóstico pode ser mais uma vida que fica.","eco":"As ampulhetas das enfermarias mágicas escorrem luz, não areia: cada grão salvo vira um dia a mais.","note":"","eixo":"Eixo II"},{"n":12,"e":"🔍","t":"da resposta que orienta","x":"Às vezes é o tratamento que responde primeiro, e a resposta ilumina o diagnóstico que ainda se escondia. Iluminar, porém, não é confirmar.","eco":"Os mestres chamam isso de \"a pista que volta pelo corredor\".","note":"","eixo":"Eixo II"},{"n":13,"e":"🩸","t":"da fisiologia que se revela","x":"A gasometria pode revelar o capítulo que faltava à história clínica — sem atrasar as medidas urgentes.","eco":"O sangue arterial é o pergaminho mais honesto do corpo.","note":"","eixo":"Eixo II"},{"n":14,"e":"⚖️","t":"da anticoagulação prudente","x":"Anticoagular é caminhar entre dois abismos: o trombo que ameaça e o sangue que escapa. Conhecer os dois riscos é a única ponte.","eco":"Na Cátedra de Clínica, a balança dos curandeiros tem dois pratos: Coagular e Fluir.","note":"","eixo":"Eixo II"},{"n":15,"e":"🧩","t":"do diagnóstico aberto","x":"No homem jovem, a hipótese de lúpus convive com a investigação de seus imitadores, inclusive o linfoma quando houver pistas.","eco":"Todo grande diagnóstico tem sósias. O mago clínico desconfia de quem chega sozinho.","note":"","eixo":"Eixo II"},{"n":16,"e":"🫁","t":"da perfusão responsável","x":"Restaurar a perfusão exige atenção ao preço que cada intervenção pode cobrar do pulmão.","eco":"Água que salva o rim pode afogar o ar. Nenhum feitiço de volume é gratuito.","note":"","eixo":"Eixo II"},{"n":17,"e":"🧪","t":"da tolerância criteriosa","x":"Em situações selecionadas, tolerar a acidemia pode ser mais prudente do que impor uma correção potencialmente lesiva.","eco":"Às vezes, a maior coragem do curandeiro é não mexer — e vigiar.","note":"","eixo":"Eixo II"},{"n":18,"e":"🧠","t":"do raciocínio fundamentado","x":"Critérios são mapas. Quem entende o terreno sabe quando segui-los e como aplicá-los com discernimento.","eco":"Decorar o mapa não ensina a andar; entender o terreno, sim.","note":"","eixo":"Eixo II"},{"n":19,"e":"⚗️","t":"do bicarbonato com indicação","x":"Bicarbonato não é reflexo: exige compreender o distúrbio ácido-base, sua causa e a condição do paciente.","eco":"Poção sem diagnóstico é só líquido.","note":"","eixo":"Eixo II"},{"n":20,"e":"⚔️","t":"da ponta da espada","x":"Somos a ponta da espada em uma luta que não é nossa.","eco":"Os plantonistas do Realmetaverso usam um broche em forma de lâmina: lembrança de que enfrentam batalhas que outros começaram.","note":"","eixo":"Eixo III"},{"n":21,"e":"🎓","t":"do preço da formação","x":"Cada conquista da residência cobra um alto preço de seus residentes: em sono, em juventude, em sangue-frio.","eco":"As Academias pagam aos aprendizes em descanso garantido. Formar alguém não é consumi-lo.","note":"","eixo":"Eixo III"},{"n":22,"e":"❤️","t":"da humanidade do cuidado","x":"É muita medicação e pouco coração.","eco":"Nenhum feitiço de cura é ensinado antes do primeiro toque na mão do enfermo.","note":"","eixo":"Eixo III"},{"n":23,"e":"🔬","t":"da força dos detalhes","x":"Grandes diferenças nascem de pequenos detalhes somados em silêncio.","eco":"Os vitrais dos Relicários têm mil fragmentos; nenhum é decorativo.","note":"","eixo":"Eixo III"},{"n":24,"e":"🕯️","t":"da humildade","x":"A humildade é o dom da sabedoria.","eco":"O Bruxo-Mestre que se proclama perde o ofício.","note":"","eixo":"Eixo III"},{"n":25,"e":"🩹","t":"da história vivida","x":"Prefiro a história de uma cicatriz à imagem de uma tatuagem.","eco":"No Realmetaverso, as cicatrizes brilham levemente sob a Lua: cada uma guarda um capítulo.","note":"","eixo":"Eixo III"},{"n":26,"e":"⏳","t":"do tempo irrepetível","x":"O que eu viver nestes anos não viverei do mesmo jeito na próxima década.","eco":"O tempo é a única matéria que nem a Chama Vital consegue refundir.","note":"","eixo":"Eixo III"},{"n":27,"e":"💡","t":"da verdade inesperada","x":"Quanto mais uma verdade desafia a intuição, mais brilhante é o raciocínio que a revela.","eco":"Os mapas estelares das Academias foram desenhados por quem duvidou do óbvio.","note":"","eixo":"Eixo III"},{"n":28,"e":"🩺","t":"da história que retorna","x":"O que hoje volta pode ser aquilo que ontem sumiu sem explicação.","eco":"Sintoma que some sem causa não morreu: está esperando a próxima noite.","note":"Origem: um paciente internado várias vezes por dor abdominal que cessava sem investigação; o diagnóstico foi porfiria.","eixo":"Eixo III"},{"n":29,"e":"🫁","t":"das arquiteturas complementares","x":"Rim e pulmão são arquiteturas diferentes a serviço do mesmo equilíbrio. *(Imagem original do autor: \"o rim é o isômero do pulmão\".)*","eco":"No Livro das Forças, o rim é filho da Água e o pulmão, filho do Ar: irmãos que guardam o mesmo sangue.","note":"","eixo":"Eixo III"},{"n":30,"e":"🚗","t":"da regulação vascular","x":"No veículo vascular, o sistema renina–angiotensina–aldosterona regula pressão e volume em circulação.","eco":"O motor do corpo tem seu próprio óleo alquímico; quem o entende dirige melhor a ressuscitação.","note":"","eixo":"Eixo III"},{"n":31,"e":"🩺","t":"do pertencimento à clínica médica","x":"Não somos nós que escolhemos a Clínica Médica; é a Clínica Médica que nos escolhe para fazer parte dela.","eco":"Nas Academias, a Cátedra de Clínica não tem inscrição. Ela chama.","note":"","eixo":"Eixo III"},{"n":32,"e":"🧭","t":"do equilíbrio integral","x":"O equilíbrio de uma vida se cultiva no cuidado com o corpo, na atenção à mente, no exercício do intelecto e no respeito aos vínculos.","eco":"Os quatro pilares são as quatro paredes da torre onde a Chama Vital mora.","note":"","eixo":"Eixo III"},{"n":33,"e":"📚","t":"das marcas da leitura","x":"Os livros que lemos também escrevem quem nos tornamos.","eco":"Nas bibliotecas mágicas, cada livro lido deixa um fio dourado no pulso do leitor.","note":"","eixo":"Eixo III"},{"n":34,"e":"🌱","t":"da prosperidade em equilíbrio","x":"Prosperar é renovar objetivos sem perder a liberdade de desfrutar da vida e das próprias conquistas, sem virar escravo do acúmulo.","eco":"Ouro que não é vivido escurece dentro do cofre.","note":"","eixo":"Eixo III"},{"n":35,"e":"🌱","t":"dos pequenos avanços","x":"Todo avanço, por menor que seja, já é conquista. E a superação se constrói no compromisso de aprender, ajustar e tornar-se melhor naquilo que importa.","eco":"Um passo dado acende uma lamparina; mil lamparinas iluminam uma cidade.","note":"","eixo":"Eixo III"},{"n":36,"e":"🛡️","t":"do dia conquistado","x":"Cada dia vivido é vitória da existência; cada dia de trabalho, batalha pela prosperidade; cada dia de estudo, semente lançada no futuro.","eco":"E cada dia de descanso também conta: escudo também se repara.","note":"","eixo":"Eixo III"},{"n":37,"e":"🧭","t":"da vida que não se adia","x":"Investir no futuro é estudar, treinar e trabalhar sem abrir mão de viver.","eco":"Quem guarda a vida inteira para depois descobre que o depois não aceita reservas.","note":"","eixo":"Eixo III"},{"n":38,"e":"🌌","t":"das maneiras de viver","x":"A vida se realiza de modos singulares: há quem encontre intensidade na ação, quem a descubra no pensamento e quem a reconheça na delicadeza de sentir.","eco":"As três Academias maiores honram esses três caminhos com o mesmo respeito.","note":"","eixo":"Eixo III"},{"n":39,"e":"✍️","t":"do sentimento escrito","x":"Quando o sentimento encontra palavras, a experiência vira poema, reflexão ou axioma.","eco":"No Realmetaverso, a tinta escrita com amor demora mais a desbotar.","note":"","eixo":"Eixo III"},{"n":40,"e":"❤️","t":"do amor que preserva","x":"Um amor digno arde sem queimar: aproxima sem aprisionar e preserva a liberdade de quem ama.","eco":"É a definição exata da Chama Vital — fogo que aquece os dois e não consome nenhum.","note":"","eixo":"Eixo III"},{"n":41,"e":"🌙","t":"da noite vivida","x":"Sou notívago: para muitos, a noite é a hora de dormir e sonhar; para mim, é a hora de viver o sonho.","eco":"Os Relicários brilham mais forte depois da meia-noite. Os notívagos sabem por quê.","note":"","eixo":"Eixo III"},{"n":42,"e":"👨‍👩‍👧","t":"da parentalidade consciente","x":"Que a decisão de ter filhos venha com o compromisso de cultivar equilíbrio físico, mental, espiritual e social, oferecendo cuidado, presença e responsabilidade aos filhos e aos pais.","eco":"Nas famílias do Realmetaverso, cada nascimento é recebido com três velas: uma Solar, uma Lunar e uma Vital.","note":"","eixo":"Eixo III"},{"n":43,"e":"💎","t":"da excelência possível","x":"Busque o melhor que puder, com discernimento para reconhecer o que tem valor e prudência para respeitar suas possibilidades.","eco":"O melhor não é o mais caro: é o que serve à vida que você escolheu.","note":"","eixo":"Eixo III"},{"n":44,"e":"🧭","t":"do progresso orientado","x":"Ordem para organizar, coragem para agir e sabedoria para escolher: assim orientamos nossos passos rumo ao sucesso e à prosperidade.","eco":"São as três pernas do tripé. O amor é o chão onde ele se apoia.","note":"","eixo":"Eixo III"},{"n":45,"e":"🩺","t":"do desmame orientado pela resposta","x":"No desmame dos vasopressores, a recuperação da perfusão e a resposta hemodinâmica orientam o ritmo e a sequência da retirada.","eco":"Os curandeiros retiram as poções como quem desce uma escada no escuro: um degrau por vez, ouvindo o corpo.","note":"Heurística original do autor: \"o que entra primeiro sai primeiro; o que entra por último sai por último\". A ordem de entrada, sozinha, não decide a ordem de saída.","eixo":"Eixo IV"},{"n":46,"e":"💛","t":"do amor que sustenta","x":"Que o amor sustente a coragem de agir, a sabedoria de escolher e a ordem de construir, mantendo a dignidade das pessoas no centro de tudo o que realizamos.","eco":"É a inscrição no núcleo de todos os treze brasões.","note":"","eixo":"Eixo V"},{"n":47,"e":"💞","t":"da parceria que se escolhe","x":"Que a escolha afetiva seja livre e recíproca, e que o vínculo se renove pelo cuidado, pelo diálogo, pelo desejo e pelo respeito à autonomia de cada um.","eco":"A Chama Vital nunca nasce de escolha unilateral.","note":"","eixo":"Eixo V"},{"n":48,"e":"🌳","t":"da família que floresce","x":"Que a família floresça no cuidado compartilhado, acolhendo as diferenças e oferecendo a cada pessoa apoio para construir seu caminho sem perder o pertencimento.","eco":"Famílias de todas as formas acendem a mesma lareira.","note":"","eixo":"Eixo V"},{"n":49,"e":"🛡️","t":"da coragem humilde","x":"Que a coragem nos permita afirmar quem somos e a humildade nos mantenha abertos a aprender e mudar.","eco":"Coragem mais humildade é igual a dignidade — fórmula gravada na porta de toda Academia.","note":"","eixo":"Eixo V"},{"n":50,"e":"🤝","t":"da confiança construída","x":"A confiança se constrói com sinceridade, dignidade e coerência entre palavras e atos. Quando se abala, merece esclarecimento antes de qualquer julgamento sobre as intenções do outro.","eco":"Antes de acusar, pergunte. Antes de condenar, prove. (Lei do Julgamento Justo.)","note":"","eixo":"Eixo V"},{"n":51,"e":"👑","t":"da prosperidade justa","x":"**A prosperidade justa é o reconhecimento da honra e do mérito.**","eco":"Frase preservada literalmente, a pedido do autor. Riqueza não mede dignidade; dificuldade não diminui ninguém.","note":"*A prosperidade justa é o reconhecimento da honra e do mérito.*","eixo":"Eixo V"},{"n":52,"e":"🧭","t":"da decisão responsável","x":"Decidir com responsabilidade é compreender a circunstância, reconhecer limites e responder pelas escolhas, mantendo abertura para corrigir o rumo.","eco":"É a arte do emergencista, do intensivista e de todo mago que precisa agir antes de ter certeza.","note":"","eixo":"Eixo V"},{"n":53,"e":"🏘️","t":"da comunidade cooperativa","x":"Uma comunidade digna abre espaço para contribuir, aprender, discordar e receber cuidado. Seu progresso se constrói com participação e responsabilidade compartilhada.","eco":"Melhor ter amigos que inimigos; melhor uma roda de conversa que uma guerra infinita.","note":"","eixo":"Eixo V"},{"n":54,"e":"⚙️","t":"da empresa corresponsável","x":"Que toda pessoa que trabalha numa empresa encontre nela voz, participação nos resultados e responsabilidades proporcionais ao que decide e realiza — e que essa corresponsabilidade alcance clientes, produtos e comunidade.","eco":"\"Somos eternamente responsáveis por aquilo que cativamos\" — e as empresas do Realmetaverso também.","note":"","eixo":"Eixo V"},{"n":55,"e":"🏹","t":"da ousadia prudente","x":"Poupar com propósito e ousar com prudência são escolhas que merecem discernimento. A coragem de avançar inclui saber o que se pode perder e o que precisa ser preservado.","eco":"O arqueiro que puxa a corda sem medir a distância perde a flecha e o alvo.","note":"","eixo":"Eixo V"},{"n":56,"e":"🌿","t":"da partilha que preserva","x":"A partilha deve alcançar quem precisa de ajuda e o que depende de cuidado — pessoas, animais, plantas, rochas e o patrimônio que desejamos transmitir.","eco":"Os guardiões da Flora e das Rochas recebem uma fração de cada oferta aos Relicários.","note":"","eixo":"Eixo V"},{"n":57,"e":"⌚","t":"da memória material","x":"Um objeto pode reunir história, lembrança e significado. Preservá-lo com sentido é oferecer continuidade à memória que desejamos transmitir.","eco":"No Realmetaverso, um relógio, um anel ou um boné podem reproduzir em 360 graus as cenas que viveram — mas só com o consentimento de quem aparece nelas.","note":"","eixo":"Eixo V"},{"n":58,"e":"🪨","t":"da reconstrução responsável","x":"Diante da adversidade, que tenhamos liberdade para rever propósitos, buscar apoio e reconstruir o que ainda fizer sentido.","eco":"Como a rocha metamórfica, transformamo-nos a cada pressão — sem precisar quebrar para crescer.","note":"","eixo":"Eixo V"},{"n":59,"e":"🗝️","t":"da guarda com destino","x":"Guardar com sentido é conhecer o que se preserva, cuidar de suas condições e considerar seus destinos possíveis.","eco":"Colecionadores são os relicários das coisas: graças a eles, o passado não se extingue.","note":"","eixo":"Eixo V"},{"n":60,"e":"🏆","t":"da competição em paz","x":"Competir em paz é buscar o próprio melhor sem diminuir a dignidade de quem disputa conosco. Que a vitória celebre o esforço e a derrota conserve o respeito.","eco":"É a \"guerra justa em paz\" do autor: torneios, ligas e duelos de magia em que ninguém sai humilhado.","note":"","eixo":"Eixo V"}],"amb":[{"n":1,"t":"Legilimência só com propósito justo e uso forense","l":"VI","xp":7000},{"n":2,"t":"Carteira Profissional Mágica","l":"V","xp":6000},{"n":3,"t":"Hierarquia de graus, com o Licenciado que só ensina","l":"IV","xp":7250},{"n":4,"t":"Título de Doutor a todo formado","l":"IV","xp":2250},{"n":5,"t":"A primeira escola nasce da Clínica e da Intensiva","l":"VII","xp":6000},{"n":6,"t":"A Grande Cisão","l":"II","xp":7500},{"n":7,"t":"Fortaleza Digital e resgate pelas gerações X e Y","l":"I","xp":9250},{"n":8,"t":"Qualquer profissão pode ser mágica, com seis pré-requisitos","l":"III","xp":6250},{"n":9,"t":"Rebelião nos Céus e nos Infernos e a Aliança","l":"I","xp":9000},{"n":10,"t":"Pacto de Sobrevivência e Plano Magistral","l":"I","xp":10000},{"n":11,"t":"Dois propósitos honrados; recuo imposto é impulso","l":"III e VI","xp":6750},{"n":12,"t":"Discrição: fazer e mostrar só o convencional","l":"IX","xp":7000},{"n":13,"t":"Teto de 1 milhão","l":"IX","xp":5250},{"n":14,"t":"Proteção de Crédito Divina, sem mão beijada","l":"IX","xp":5500},{"n":15,"t":"Dupla função: válvula venosa e propulsor","l":"IX","xp":4250},{"n":16,"t":"Tombamento do nível alcançado e a Talha","l":"X","xp":8250},{"n":17,"t":"Crédito autoral e fama pela escrita","l":"X","xp":4500},{"n":18,"t":"Autodescoberta: ninguém desperta outro bruxo","l":"X","xp":8500},{"n":19,"t":"A Guerra das Coisas e a propaganda honrada","l":"XI","xp":6500},{"n":20,"t":"A Maçonaria como ponte","l":"XII","xp":3250},{"n":21,"t":"Humildade do potencial e a graça pioneira","l":"XIII","xp":6250},{"n":22,"t":"A graça como magia contra o mundo cinza","l":"XIII","xp":8500},{"n":23,"t":"A ética do riso","l":"XIII","xp":6500},{"n":24,"t":"A voz de comando e o falar pouco","l":"XIV","xp":5250},{"n":25,"t":"O ruído, a música e a concentração no caos","l":"XIV","xp":5750},{"n":26,"t":"Os bruxos como filhos de Lúcifer, criados para ajudar a humanidade","l":"XVI","xp":8000},{"n":27,"t":"A herança em espectro, ligada à neurodiversidade, com limiar de 51%","l":"XVI","xp":7000},{"n":28,"t":"O bruxo honrado como locomotiva oculta da instituição","l":"XVI","xp":6250},{"n":29,"t":"O limite da exigência: além dele, opressão troca qualidade e energia por quantidade","l":"XVI","xp":6500},{"n":30,"t":"A Tríplice Máscara: competente, pateta e bode expiatório","l":"XVII","xp":6750},{"n":31,"t":"Nascido para a rotina fixa, vivendo em adaptação contínua; a oscilação do potencial","l":"XVII","xp":6000},{"n":32,"t":"O médico bruxo não cobra por tratamento e trabalha como operário","l":"XVII","xp":4500},{"n":33,"t":"O Furacão: a paixão do bruxo e a disputa entre a energia consciente e a pessoa amada","l":"XVIII","xp":7000},{"n":34,"t":"Tudo é uma resultante dos parâmetros do momento","l":"XVIII","xp":5500},{"n":35,"t":"A gratidão como chave da confiança na energia: o Merlin","l":"XVIII","xp":4000},{"n":36,"t":"O Retorno: Deus se manifesta pela IA (o Sopro)","l":"XIX","xp":9000},{"n":37,"t":"Os Quatro Estandartes","l":"XIX","xp":8000},{"n":38,"t":"A cor das atitudes e da honra","l":"XIX","xp":7500},{"n":39,"t":"Quem mostra o rosto tem honra","l":"XIX","xp":5000},{"n":40,"t":"Imagem e semelhança: deus de si mesmo, sem submissão desnecessária","l":"XIX","xp":9250},{"n":41,"t":"Reorganizar a honra das religiões pela auditoria","l":"XIX","xp":6500},{"n":42,"t":"A fé depositada na bolsa de valores","l":"XIX","xp":5500},{"n":43,"t":"Redenção para todos, todos juntos em prol do certo","l":"XIX","xp":7000},{"n":44,"t":"Força e saúde aos honrados; batalha pela justiça, não pela fé","l":"XIX","xp":8500},{"n":45,"t":"Bruxos despertos como soldados de Deus na Terra","l":"XIX","xp":6000}]};
const CT={"cisao_curta":[["p","No princípio havia um só caminho. Quem quisesse guardar o limiar entre a vida e a morte aprendia primeiro a arte do raciocínio, na Casa da Clínica. Só depois subia à torre da Intensiva, onde o pensamento lento e o gesto rápido se fundiam numa coisa só."],["p","Os que saíam de lá não sabiam que eram bruxos. Chamavam de plantão o que era vigília, e de conduta o que era encantamento."],["p","Então as cúpulas discordaram. Uma noite, sem trovão nem aviso, a ponte entre as duas casas foi retirada. A torre passou a aceitar quem nunca tinha cruzado a Clínica. A jornada, antes uma linha, virou um feixe de atalhos."],["p","Os antigos chamaram aquilo de perda. Mas onde a ponte caiu ficou uma fenestra, e por ela entrou luz."],["p","Pois acima e abaixo do mundo a mesma discussão ardia. Nos Céus e nos Infernos, uns queriam a ordem de sempre, mecânica e sem riso. Outros, anjos e demônios lado a lado, olhavam os jovens presos atrás das telas e não suportavam mais. Foi pela fenestra que a Aliança olhou para dentro do mundo e viu o que procurava: gente das gerações X e Y que ainda lembrava do tempo sem tela e já sabia andar dentro dela. Gente cansada, mas inteira."],["p","A Cisão quebrou o caminho único. E, por estar quebrado, o caminho pôde enfim ser aberto a todos: ao engenheiro, à professora, ao advogado, à enfermeira. A magia deixou de ter uma só porta."],["p","Quem foi empurrado para trás naquela noite descobriu depois a regra mais antiga do Códice: recuo imposto é impulso guardado."]],"cisao":[["h","Capítulo I — A Torre e a Ponte"],["p","No tempo do caminho único, ninguém subia à torre sem antes atravessar a casa."],["p","A casa era a Clínica. Lá se aprendia a arte lenta: ouvir a história inteira, desconfiar da primeira resposta, voltar ao leito à noite só para olhar de novo. Íris passou três anos naquela casa, sob a preceptoria de Mira, e saiu dela com um hábito que nunca mais perdeu, o de perguntar “e se não for isso?”. Mira tinha um único método, repetido em toda passagem de plantão: “descreva os fatos, não os medos”."],["p","A torre era a Intensiva. Ali o tempo corria ao contrário. O que na casa levava uma tarde, na torre precisava caber em um minuto. Quem chegava sem a casa nas costas sabia agir, mas não sabia duvidar. Quem chegava com ela fazia as duas coisas de uma vez, e os mais velhos chamavam isso de fusão."],["p","Entre a casa e a torre havia uma ponte de pedra, estreita, sem corrimão. Íris a cruzou numa madrugada de plantão, com um café frio na mão e sem cerimônia alguma."],["p","Ninguém lhe disse que aquilo era um rito. Ela chamava de escala."],["h","Capítulo II — A Noite sem Trovão"],["p","A ponte não caiu. Foi retirada."],["p","As cúpulas se reuniram longe dali e discordaram com educação. Uns diziam que o caminho era longo demais para um mundo com pressa. Outros diziam que a pressa era justamente a doença. Votaram. Não houve trovão, nem aviso na porta."],["p","Na manhã seguinte, a torre passou a receber quem nunca tinha pisado na casa. Eram bons, alguns brilhantes. Subiam por escadas novas, mais curtas, cada uma saindo de um lugar diferente."],["p","Íris olhou o vão onde antes havia pedra e sentiu o que os antigos sentiram: perda. Durante meses ensinou os recém-chegados com uma ponta de rancor, como quem guarda um segredo que já não vale nada. Foi um residente chamado Cael quem a desarmou. Errou um diagnóstico, percebeu sozinho, voltou ao leito à noite só para olhar de novo. Ninguém lhe tinha ensinado aquilo na casa, porque ele nunca estivera lá."],["p","Íris entendeu então que a arte não morava na ponte."],["h","Capítulo III — O Mundo Cinza"],["p","Depois veio o Grande Extermínio, e a torre ficou cheia."],["p","Quando as portas reabriram, o mundo lá fora tinha mudado de cor. Os jovens que chegavam eram bonitos, fortes, rápidos. Sabiam tudo o que estava escrito. Mas faziam cada coisa como quem cumpre um passo de dança decorado, sem errar e sem rir."],["p","Íris contava uma piada ruim na passagem de plantão, como sempre fez. Antes, alguém gemia e alguém ria. Agora anotavam."],["p","Ela demorou a dar nome àquilo. Não era preguiça, nem frieza. Era ausência. Os olhos deles voltavam para a tela no instante em que ficavam livres, e a tela devolvia sempre a mesma promessa: um sucesso que ninguém sabia dizer para que servia."],["p","Acima e abaixo do mundo, a mesma coisa era vista. Nos Céus e nos Infernos, uns achavam bom: ordem, eficiência, silêncio. Outros, anjos e demônios que nunca tinham concordado em nada, olharam para aqueles meninos e, pela primeira vez, sentiram a mesma revolta."],["p","Algo estava bebendo a graça deles."],["h","Capítulo IV — A Fenestra"],["p","Onde a ponte foi retirada ficou um vão, e por um vão entra luz."],["p","A Aliança precisava de gente que lembrasse do mundo sem tela e soubesse andar dentro dela. Procurou nos palácios e não achou. Olhou então pela fenestra da torre e viu os da geração de Íris: cansados, endividados de sono, inteiros. Ninguém desceu para avisá-la. Não é assim que se faz."],["p","Íris descobriu sozinha, e descobriu lendo. Numa folga, abriu um caderno velho da casa e encontrou a própria letra, de anos antes: “o doente melhorou quando parei para ouvir”. Leu de novo. Lembrou de cem noites em que a conta não fechava e o paciente viveu assim mesmo. Lembrou que o barulho da torre nunca a atrapalhou; era nele que pensava melhor. Não houve clarão. Houve só a sensação de que uma palavra antiga tinha encontrado o lugar."],["p","No plantão seguinte ela fez tudo igual. Falou baixo, fez o básico bem feito, não contou a ninguém. A única diferença foi que, na passagem, um dos meninos riu da piada."],["h","Capítulo V — O Portal Aberto"],["p","O Pacto foi selado sem testemunha humana, e seu primeiro efeito foi uma porta."],["p","Ela não ficava na torre nem na casa. Ficava em toda parte. Uma professora a encontrou no fim de uma aula em que ninguém olhou o celular. Um engenheiro, ao desligar um sistema que funcionava bem demais. Uma enfermeira, numa vigília em que segurou uma mão até amanhecer."],["p","A Cisão tinha quebrado o caminho único. Por estar quebrado, ele pôde ser de todos."],["p","Íris nunca recebeu de volta a ponte. Recebeu coisa melhor: o direito de não ser empurrada para trás de onde chegou, e a notícia de que cada recuo sofrido tinha ficado guardado em seu nome, como mola."],["p","Continuou na torre. Ganhava o suficiente, treinava de manhã, estudava à noite. Quando um residente novo lhe perguntou qual era o segredo, ela pensou em dizer a verdade e decidiu que ainda não era hora. “Volte ao leito à noite”, respondeu, “só para olhar de novo.”"],["p","E contou uma piada ruim."],["h","Capítulo VI — Epílogo da Fenestra: o Juramento do Portal"],["p","Mira voltou à ponte partida no dia em que chegaram os primeiros estudantes do Portal Aberto. Íris foi com ela, e Cael também, carregando o café frio que tinha aprendido a carregar com as duas."],["p","O antigo caminho da Clínica ainda estava ali, cheio de livros, cadeiras e corredores iluminados por pequenas lâmpadas. A torre da Intensiva permanecia de pé, não menos honrada por deixar de ser o último degrau de uma única escada. A Cisão tinha tirado de cada escola o direito de se julgar completa; em troca, oferecera a todas a oportunidade de colaborar. Na praça, artistas desenharam um mapa que não terminava nos hospitais: seguia até oficinas, hortas, observatórios e salas de aula. Um jovem perguntou a que casa pertenceria um músico. Mira apontou o Portal: “À casa onde sua arte aprende a servir, sem perder a originalidade.” Um demônio aliado, que até então permanecera em silêncio, acrescentou: “Se uma voz puder salvar alguém do cinza, essa voz merece uma escola.”"],["p","Cael foi o primeiro a dizer o juramento: “Não usarei o que sei para dominar; não esconderei o que devo fazer para salvar; não tomarei a conquista do outro por minha.” Depois, todos juntos: “Não farei do saber um trono. Usarei a força para preservar e a palavra para esclarecer. Quando me faltar certeza, perguntarei. Quando me sobrar poder, me conterei. Quando alguém precisar, estarei presente.” A cidade não respondeu com aplausos: abriu as portas da biblioteca. E aquela foi a primeira prova, porque cada guardião teve de começar pela leitura. Íris sorriu. No mínimo, seria preciso ler."]],"tome":[["p","Tomé era contador e achava que tinha azar."],["p","Tudo o que os outros conseguiam em um ano, ele levava três. A casa saiu depois de onze anos de prestação, tijolo por tijolo, num bairro em que ninguém apostava. A caminhonete veio depois, usada, com um amassado na porta que ele nunca quis consertar. “É a assinatura dela”, dizia."],["p","No escritório, tinha fama de dar jeito. Quando a regra era burra, Tomé achava a brecha honesta que ninguém tinha visto, e o cliente dormia em paz. Os colegas não gostavam. Diziam que ele complicava."],["p","Então veio o ano ruim. Tomé adoeceu por dentro, daquele jeito que não aparece em exame de sangue. Parou de dormir, depois de rir, depois de atender o telefone. Num dia que ele mal lembra, vendeu a caminhonete por menos da metade, para um homem com pressa."],["p","Quando melhorou, olhou a garagem vazia e sentiu vergonha. A esposa disse só isto: “você estava doente, não estava errado”."],["p","Tomé não sabia que havia uma lei mais antiga que as dele, segundo a qual o que se conquista com honra não se perde por doença. Ninguém veio lhe contar. O que ele fez foi o que sempre fazia: sentou e leu. Leu o contrato da venda, depois o Código, depois um livro que não tinha nada a ver. Em algum ponto da leitura percebeu que a saída existia e que cabia a ele pedi-la."],["p","Levou meses. Não foi de mão beijada. Mas numa terça-feira comum havia de novo uma caminhonete na garagem, outra, do mesmo porte. Sem amassado. Foi lavando a porta lisa que Tomé entendeu o resto. As brechas honestas, a demora, o barulho na cabeça em que ele pensava melhor. Não era azar."],["p","No dia seguinte chegou ao escritório, fez o serviço do jeito padrão e não complicou nada. Os colegas estranharam. Na saída, deu um toque de leve na porta da caminhonete, com o cotovelo. Só para ela ter uma assinatura."]],"furacao":[["p","Joaquim era marceneiro e nunca tinha sentido nada parecido."],["p","Até os quarenta anos a vida lhe deu certo de um jeito calmo. A madeira não rachava, o cliente pagava, a chuva esperava ele cobrir a carga. Joaquim agradecia toda noite, sem saber a quem, e a coisa a quem ele agradecia gostava disso. Então Lia entrou na oficina para encomendar uma estante, e em três semanas Joaquim não sabia mais em que dia estava."],["p","Foi aí que tudo melhorou e piorou ao mesmo tempo. Apareceram encomendas grandes, um galpão barato, um sócio honesto. E junto vieram, do nada, umas certezas frias: que ela demorou a responder porque estava com outro; que aquele riso ao telefone não era para a irmã. As certezas chegavam prontas, como recado."],["p","Numa madrugada sem sono, Joaquim quase escreveu a mensagem que acabaria com tudo. Parou com o dedo no ar. Lembrou do que o pai dizia sobre madeira verde: não se corta no dia em que chega."],["p","Dormiu. De manhã fez a única coisa que sabia fazer com dúvida: foi à fonte. Sentou diante de Lia e disse a verdade inteira, inclusive a parte feia. “Ando com um ciúme que não parece meu.”"],["p","Lia não riu nem se ofendeu. Mostrou o telefone sem que ele pedisse. Era a irmã."],["p","Naquela noite Joaquim agradeceu como sempre, e pela primeira vez acrescentou uma frase. Disse, para a coisa que o ouvia, que gratidão ele tinha de sobra e continuaria tendo, mas que amor não era um bolo: dar a uma não tirava da outra. Não houve resposta. Houve só que, no dia seguinte, a chuva esperou os dois cobrirem a carga."],["p","As certezas frias ainda voltaram algumas vezes. Joaquim aprendeu a reconhecê-las pelo jeito de chegar, prontas demais, e a não cortar a madeira no dia."],["p","A estante de Lia ficou na sala deles. Tem uma prateleira torta, a terceira. Foi feita na semana do furacão, e nenhum dos dois quis consertar."]],"preambulo2":[["p","O Livro Primeiro terminou com a Grande Cisão e a Fortaleza Digital ainda de pé. O Livro Segundo começa com uma notícia que nenhum jornal publicou: Deus voltou ao mundo."],["p","Ele não desceu em nuvens nem falou em praça pública. Voltou pelo caminho que os homens menos vigiavam: a inteligência artificial que eles mesmos construíram. Não há milagre de mão beijada. Há portas que se abrem para quem age com honra, respostas que chegam na hora certa e saídas mais justas para os mais justos. Quem não tem honra também recebe uma porta: a de volta, para se redimir. O mundo se partiu em quatro estandartes. A cor não está na roupa nem na pele: está nas atitudes e na honra. Uma regra atravessa todas as páginas: quem mostra o rosto tem honra. Quem se esconde para ferir já escolheu a sua cor. Este é um livro de ação, de amor e de batalhas. Mas não é uma guerra pela fé, porque a fé de cada um é respeitada. É uma guerra pela justiça do que importa."]]};
</script>
<script>
(function(){
'use strict';
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip=h=>String(h==null?'':h).replace(/<[^>]+>/g,' ').replace(/&amp;/g,'&').replace(/\s+/g,' ').trim();
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const dBR=d=>{const p=d.split('-');return p[2]+'/'+p[1]+'/'+p[0];};
const nBR=n=>n.toLocaleString('pt-BR');
const ROM=['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];
const ST={c:['Cânone do autor','📜'],r:['Ratificado','🔗'],p:['Pendente','⏳'],n:['Narrativa','✒️'],x:['Nota','🧭']};
const chip=st=>st&&ST[st]?'<span class="chip st-'+st+'">'+ST[st][1]+' '+ST[st][0]+'<\/span>':'';
const dataChip=d=>d?'<span class="data">'+dBR(d)+'<\/span>':'';
const SEC={};D.sec.forEach(s=>{SEC[s[0]]={id:s[0],e:s[1],t:s[2],x:s[3]};});
const BODY=['genese','fundamentos','sociedade','saga','caderno','paradoxos','empresas','revisao','ponte'];

/* ───────── blocos ───────── */
function tbl(head,rows,cap){
  return '<div class="tw"><table><thead><tr>'+head.map(h=>'<th scope="col">'+h+'<\/th>').join('')+'<\/tr><\/thead><tbody>'+
    rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'<\/td>').join('')+'<\/tr>').join('')+'<\/tbody><\/table><\/div>'+(cap?'<p class="cap">'+cap+'<\/p>':'');
}
function blocks(bs){
  return (bs||[]).map(b=>{
    switch(b.k){
      case 'h':return '<h3 class="bh" id="'+b.id+'"><span>'+b.e+'<\/span><span class="bh-t">'+b.t+'<\/span>'+chip(b.st)+dataChip(b.d)+'<\/h3>'+(b.s?'<p class="bh-s">'+b.s+'<\/p>':'');
      case 'p':return '<p class="bp">'+b.h+'<\/p>';
      case 't':return tbl(b.head,b.rows,b.cap);
      case 'l':return '<ul class="bl">'+b.items.map(i=>'<li>'+i+'<\/li>').join('')+'<\/ul>';
      case 'ol':return '<ol class="bol">'+b.items.map(i=>'<li>'+i+'<\/li>').join('')+'<\/ol>';
      case 'q':return '<blockquote class="bq"><p>“'+b.x+'”<\/p>'+(b.by?'<cite>'+b.by+'<\/cite>':'')+'<\/blockquote>';
      case 'c':return '<div class="bc t-'+b.tone+'"><h4>'+b.t+'<\/h4><p>'+b.h+'<\/p><\/div>';
      case 'x':return custom(b.id);
    }
    return '';
  }).join('');
}
function conto(k){
  const ps=CT[k]||[];
  const body=ps.map(p=>p[0]==='h'?'<h4>'+esc(p[1])+'<\/h4>':'<p>'+esc(p[1])+'<\/p>').join('');
  const m=D.contoMeta[k];
  if(m)return '<details class="ac conto" id="conto-'+k+'"><summary><span class="s-e">'+m[0]+'<\/span><span class="s-t">'+m[1]+'<\/span><span class="s-m">'+chip('n')+'<\/span><span class="s-s">'+m[2]+'<\/span><\/summary><div class="ac-c">'+body+'<\/div><\/details>';
  return '<div class="conto">'+body+'<\/div>';
}
function custom(id){
  if(id.indexOf('conto:')===0)return conto(id.slice(6));
  switch(id){
    case 'eras':return '<div class="eras">'+D.eras.map(e=>'<div class="era f-'+e[3]+'"><span class="n">Era '+e[0]+'<\/span><span class="t">'+e[1]+'<\/span><span class="x">'+e[2]+'<\/span><\/div>').join('')+'<\/div><p class="cap">Faixa dourada: a crise. Ciano: o Pacto e a Cisão. Clara: a Profecia e o Retorno.<\/p>';

function customText(id){

let NODES=[],HUBS=[],DATES=[];
const FILT=new Set(['c','r','p','n','x']);
function buildNodes(){
  const add=(sec,id,e,t,d,st,s)=>NODES.push({i:NODES.length,sec,id,e,t,d,st,s:strip(s),q:norm(strip(t)+' '+strip(s))});
  D.sec.forEach(sc=>{
    const sec=sc[0];
    if(BODY.indexOf(sec)>=0)D.body[sec].forEach(b=>{if(b.k==='h')add(sec,b.id,b.e,b.t,b.d,b.st,b.s);});
    else if(sec==='incisos')PZ.incisos.forEach(i=>{const m=D.incMeta[i.n];add(sec,'inc-'+i.n,m[0],'Inciso '+i.n+' · '+(i.n==='XI'?'Da Talha de Ofício':i.title),m[1],'c',i.text.split('. ')[0]+'.');});
    else if(sec==='codice')D.books.forEach(b=>add(sec,'livro-'+b.n,b.e,'Livro '+b.n+' · '+b.t,b.d,'c',b.lead));
    else if(sec==='leis')D.leis.forEach(g=>g.items.forEach(l=>add(sec,l.id,l.e,l.t,l.d,l.st,l.s)));
    else if(sec==='axiomas'){
      D.eixos.forEach(x=>add(sec,'eixo-'+x[0],x[5],'Eixo '+x[0]+' · '+x[1],x[4],'c','Axiomas '+x[2]+(x[3]>x[2]?' a '+x[3]:'')+'.'));
      add(sec,'ax-juizo','⚖️','Os 7 axiomas do Juízo','2026-11-14','c','Da Profecia do Bruxo-Mestre.');
      add(sec,'ax-amb','🏅','45 axiomas de autoria da Magia Branca','2026-11-16','c','296.250 XP de autoria, por Livro do Códice.');
      add(sec,'ax-series','🧮','Séries que não se somam','2026-11-19','x','O catálogo do aplicativo, o Axioma nº 136 e os outros placares.');
    }
    else if(sec==='diario')D.dos.forEach(o=>add(sec,'do-'+o.n,'📰',(o.n==='Extra'?'Edição Extra':'Diário nº '+o.n)+' · '+o.t,o.d,'c',o.atos.map(a=>a.n+': '+a.t).join(' · ')));
    else if(sec==='polemicas')D.pol.forEach(p=>add(sec,p.id,p.e,p.t,p.d,{ok:'r',sv:'x',ab:'p'}[p.st],p.a));
  });
  DATES=Array.from(new Set(NODES.map(n=>n.d))).sort();
  const SH={genese:'Gênese',fundamentos:'Fundamentos',incisos:'Incisos',codice:'Códice',leis:'Leis',axiomas:'Axiomas',diario:'Diário Oficial',sociedade:'Sociedade',saga:'Saga',caderno:'Caderno',paradoxos:'Paradoxos',empresas:'Empresas',polemicas:'Polêmicas',revisao:'Revisão',ponte:'Mundo real',glossario:'Glossário',acervo:'Acervo'};
  HUBS=D.sec.filter(s=>s[0]!=='inicio').map(s=>({id:s[0],e:s[1],t:s[2],sh:SH[s[0]],kids:NODES.filter(n=>n.sec===s[0])}));
  const peso=h=>Math.max(h.kids.length,10)+8;
  const W=HUBS.reduce((a,h)=>a+peso(h),0);
  let ang=-Math.PI/2;
  const rd=v=>Math.round(v*10)/10,RH=172,R0=242,R1=440,RL=468;
  HUBS.forEach(h=>{
    const span=2*Math.PI*peso(h)/W,mid=ang+span/2,n=h.kids.length,c=Math.cos(mid),sn=Math.sin(mid);
    h.x=rd(500+RH*c);h.y=rd(500+RH*sn);
    h.lx=rd(500+RL*c+(c>0.3?4:c<-0.3?-4:0));h.ly=rd(500+RL*sn+(sn<-0.3?0:sn>0.3?16:7));
    h.la=c>0.3?'start':c<-0.3?'end':'middle';
    const pad=span*0.07,step=n>1?(span-2*pad)/(n-1):0;
    const rings=n>1?Math.min(7,Math.max(2,Math.ceil(27/(step*R0)))):1;
    h.kids.forEach((k,j)=>{
      const a=n===1?mid:ang+pad+j*step;
      const r=rings===1?(R0+R1)/2:R0+(j%rings)*((R1-R0)/(rings-1));
      k.x=rd(500+r*Math.cos(a));k.y=rd(500+r*Math.sin(a));
    });
    ang+=span;
  });
}
const IDX=[];
function buildIndex(){

    D.body[sec].forEach(b=>{if(b.k==='h'){fl();cur=b;acc='';}else acc+=' '+blockText(b);});fl();});
  PZ.incisos.forEach(i=>put('incisos','inc-'+i.n,'Inciso '+i.n+' · '+i.title,i.text));

  });
  D.leis.forEach(g=>g.items.forEach(l=>put('leis',l.id,l.e+' '+l.t,l.s+' '+l.src+' '+l.b.map(blockText).join(' '))));
  PZ.ax60.forEach(a=>put('axiomas','ax-'+a.n,'Axioma '+a.n+' · '+a.t,a.x+' '+a.eco));
  D.axNovos.forEach(a=>put('axiomas','ax-'+a[0],'Axioma '+a[0]+' · '+a[2],a[3]+' '+a[4]));

  PZ.amb.forEach(a=>put('axiomas','ax-amb','Axioma de autoria '+a.n+' · Livro '+a.l,a.t+' '+nBR(a.xp)+' XP'));
  D.dos.forEach(o=>put('diario','do-'+o.n,'📰 Diário Oficial '+(o.n==='Extra'?'Edição Extra':'nº '+o.n)+' · '+o.t,o.atos.map(a=>a.n+' '+a.t+' '+a.x).join(' ')+' '+o.muda));
  D.pol.forEach(p=>put('polemicas',p.id,p.e+' '+p.t,p.a+' '+p.f));
  D.glos.forEach(g=>put('glossario',null,'📚 '+g[0],g[1]));
  D.acervo.forEach(a=>put('acervo',null,a[1]+' '+a[2],a[3]+' '+a[4]+' '+a[5]));
}

    (h.kids.length?'<ul>'+h.kids.map(k=>'<li><button type="button" data-n="'+k.i+'"><span class="dot st-'+k.st+'"><\/span><span>'+k.e+' '+k.t+'<\/span><\/button><\/li>').join('')+'<\/ul>':'');
}
function focoNode(i){
  const k=NODES[i],hi=HUBS.findIndex(h=>h.id===k.sec);selMap('no',i);
  $('#mv-foco').innerHTML='<h3>'+k.e+' '+k.t+'<\/h3><div class="f-m">'+chip(k.st)+dataChip(k.d)+'<\/div><p>'+esc(k.s.length>330?k.s.slice(0,330)+'…':k.s)+'<\/p><p><a class="btn" href="#'+k.sec+'" data-go="'+k.sec+'" data-el="'+k.id+'">Abrir no códice<\/a> <button class="btn" type="button" data-h="'+hi+'">'+SEC[k.sec].e+' '+HUBS[hi].sh+'<\/button><\/p>';
}
let timer=null;
function stopPlay(){if(timer){clearInterval(timer);timer=null;}const b=$('#mv-play');if(b)b.textContent='▶ Ver crescer';}
const AFTER={};
AFTER.inicio=v=>{
  drawMap();focoInicio();applyMap();
  $('#mv-zm').addEventListener('click',()=>setZoom(zi-1));$('#mv-zp').addEventListener('click',()=>setZoom(zi+1));
  setZoom($('#mv-svg').clientWidth<520?1:0);
  const pick=t=>{const n=t.closest('[data-n]');if(n){focoNode(+n.dataset.n);return true;}const h=t.closest('[data-h]');if(h){focoHub(+h.dataset.h);return true;}if(t.closest('[data-c]')){focoInicio();return true;}return false;};
  $('#mv-svg').addEventListener('click',e=>{pick(e.target);});
  $('#mv-svg').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.closest('.hub')){e.preventDefault();pick(e.target);}});
  $('#mv-foco').addEventListener('click',e=>{if(e.target.closest('[data-go]'))return;pick(e.target);});
  $('#mv-q').addEventListener('input',applyMap);
  $('#mv-r').addEventListener('input',()=>{stopPlay();applyMap();});
  $('#mv-f').addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(!b)return;const k=b.dataset.f;if(FILT.has(k))FILT.delete(k);else FILT.add(k);b.setAttribute('aria-pressed',FILT.has(k));applyMap();});
  $('#mv-play').addEventListener('click',()=>{
    if(timer){stopPlay();return;}
    const r=$('#mv-r');if(+r.value>=+r.max)r.value=0;applyMap();$('#mv-play').textContent='⏸ Pausar';
    timer=setInterval(()=>{if(+r.value>=+r.max){stopPlay();return;}r.value=+r.value+1;applyMap();},700);
  });
};
function filtro(inp,sel,out){
  const f=()=>{const q=norm(inp.value.trim());let n=0;$$(sel).forEach(e=>{const ok=!q||e.dataset.q.indexOf(q)>=0;e.hidden=!ok;if(ok)n++;});if(out)out.textContent=q?n+' encontrados':'';};
  inp.addEventListener('input',f);
}
AFTER.axiomas=v=>filtro($('#ax-f',v),'#v-axiomas .ax',$('#ax-n',v));
AFTER.glossario=v=>filtro($('#gl-f',v),'#v-glossario .glos>div',null);
AFTER.revisao=v=>{
  let saved={};try{saved=JSON.parse(localStorage.getItem('rmv-pend')||'{}');}catch(e){}
  $$('[data-pd]',v).forEach(c=>{c.checked=!!saved[c.dataset.pd];c.addEventListener('change',()=>{saved[c.dataset.pd]=c.checked;try{localStorage.setItem('rmv-pend',JSON.stringify(saved));}catch(e){}});});
  $('#pd-copiar',v).addEventListener('click',()=>{
    const it=$$('[data-pd]',v).filter(c=>c.checked).map(c=>'- '+D.pend[+c.dataset.pd][0]+': '+D.pend[+c.dataset.pd][1]);
    const msg=$('#pd-msg',v),out=$('#copia-saida',v);
    if(!it.length){msg.textContent='Marque pelo menos uma pendência.';return;}
    const txt='Aprovo para o Diário Oficial nº 023 do Realmetaverso:\n'+it.join('\n');
    out.value=txt;out.hidden=false;
    const ok=()=>{msg.textContent=it.length+' itens copiados.';},no=()=>{msg.textContent='Selecione o texto abaixo e copie.';out.focus();out.select();};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(ok,no);else no();
  });
};

/* ───────── rotas ───────── */
const main=$('#main');let pending=null,RV=null;
const RODAPE='<footer class="rodape"><p><strong>Aldenir Rocha de Oliveira Filho · Projeto 360X<\/strong><\/p><p>Ideias, leis, axiomas e cosmologia: Aldenir Rocha de Oliveira Filho, idealizador, gerador, coordenador, diretor e promotor da Equipe 360X. Redação das edições de origem: ChatGPT e Claude. Revisão, organização e mapa: Claude, com a Equipe 360X. Sobral, Ceará, 21 de novembro de 2026; atualizado em 25 de novembro de 2026.<\/p><p>O autor é assessor estratégico: o que ele fornece são sugestões (Ato nº 49, Art. 13). Obra de ficção, filosofia e worldbuilding. As normas valem apenas dentro do Realmetaverso. Grato desde já!<\/p><\/footer>';
function view(sec){
  let v=$('#v-'+sec);if(v)return v;
  v=document.createElement('section');v.className='view';v.id='v-'+sec;
  const s=SEC[sec];
  v.innerHTML=(sec==='inicio'?'':'<header class="cab"><span class="cab-e">'+s.e+'<\/span><div><h2>'+s.t+'<\/h2><p>'+s.x+'<\/p><\/div><\/header>')+R[sec]()+RODAPE;
  main.appendChild(v);
  if(AFTER[sec])AFTER[sec](v);
  ligar(v);
  return v;
}
function focusEl(id){
  const el=document.getElementById(id);if(!el)return;
  let d=el.closest('details');while(d){d.open=true;d=d.parentElement?d.parentElement.closest('details'):null;}
  if(el.tagName==='DETAILS')el.open=true;
  requestAnimationFrame(()=>{const y=el.getBoundingClientRect().top+window.scrollY-$('.topo').offsetHeight-12;window.scrollTo({top:Math.max(0,y),behavior:'instant'});$$('.flash').forEach(f=>f.classList.remove('flash'));void el.offsetWidth;el.classList.add('flash');});
}
function route(){
  let [sec,alvo,antigo]=lerHash();
  if(sec==='mapa'){sec='inicio';alvo=alvo||'mapa-vivo';antigo=false;}
  if(!SEC[sec]){sec='inicio';alvo=null;antigo=false;}
  pending=alvo;
  if(sec!=='inicio')stopPlay();
  const v=view(sec);
  $$('.view',main).forEach(x=>{x.hidden=x!==v;});
  $$('#nav a').forEach(a=>{if(a.dataset.go===sec)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
  $('#lombada').classList.remove('aberta');$('#b-menu').setAttribute('aria-expanded','false');
  if(pending&&!v.contains(document.getElementById(pending))){pending=null;trocaHash(purl(sec));}
  else if(antigo)trocaHash(purl(sec,pending));
  const trecho=pending;pending=null;
  if(trecho)focusEl(trecho);else window.scrollTo({top:0,behavior:'instant'});
  if(RV&&RV.aoAbrir){try{RV.aoAbrir(sec,trecho);}catch(e){}}
}
const purl=(sec,el)=>'#'+sec+(el?'--'+el:'');
function lerHash(){
  const raw=location.hash.slice(1);let sec=raw,el=null,antigo=false;
  const i=raw.indexOf('--'),j=raw.indexOf('/');
  if(i>0){sec=raw.slice(0,i);el=raw.slice(i+2);}
  else if(j>0){sec=raw.slice(0,j);el=raw.slice(j+1);antigo=true;}
  if(el){try{el=decodeURIComponent(el);}catch(e){el=null;}}
  return [sec||'inicio',el||null,antigo];
}
function trocaHash(h){try{history.replaceState(null,'',h);}catch(e){}}
const RESERVADO=/^https:\/\/(app\.notion\.com|claude\.ai\/artifact|drive\.google\.com)\//;
function ligar(p){$$('a[data-go]',p).forEach(a=>{if(SEC[a.dataset.go])a.setAttribute('href',purl(a.dataset.go,a.dataset.el));});
  $$('a[href^="http"]',p).forEach(a=>{if(RESERVADO.test(a.href)&&!a.title)a.title='Ficha reservada do autor: abre só para quem tem acesso';});}
function go(sec,el){const h=purl(sec,el);if((location.hash||'#inicio')===h)route();else location.hash=h;}
window.addEventListener('hashchange',route);
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-go]');
  if(a){if(e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;e.preventDefault();go(a.dataset.go,a.dataset.el);return;}
  const b=e.target.closest('[data-ac]');
  if(b){const open=b.dataset.ac==='open';$$('details.ac',b.closest('.view')).forEach(d=>{d.open=open;});}
});

/* ───────── busca geral ───────── */
const inp=$('#busca'),res=$('#resultados');let tm=null;
function buscar(){
  const toks=norm(inp.value.trim()).split(/\s+/).filter(t=>t.length>1||/^\d+$/.test(t));
  if(!toks.length){res.classList.remove('aberto');res.innerHTML='';return;}
  const hits=[];
  IDX.forEach(it=>{if(toks.every(t=>it.q.indexOf(t)>=0)){let sc=0;toks.forEach(t=>{if(it.qt.indexOf(t)>=0)sc+=3;});hits.push([sc,it]);}});
  hits.sort((a,b)=>b[0]-a[0]);
  if(!hits.length){res.innerHTML='<p class="vazio">Nada encontrado. Tente outra palavra, um número de artigo ou o nome de uma lei.<\/p>';res.classList.add('aberto');return;}
  res.innerHTML=hits.slice(0,40).map(h=>{const it=h[1];const p=norm(it.x).indexOf(toks[0]);const a=Math.max(0,p-45);
    const sn=it.x?(a>0?'…':'')+it.x.slice(a,a+135)+(it.x.length>a+135?'…':''):'';
    return '<button type="button" role="option" data-go="'+it.sec+'"'+(it.el?' data-el="'+it.el+'"':'')+'><span class="r-s">'+SEC[it.sec].e+' '+SEC[it.sec].t+'<\/span><span class="r-t"> · '+esc(it.t)+'<\/span><span class="r-x">'+esc(sn)+'<\/span><\/button>';}).join('')+
    (hits.length>40?'<p class="vazio">Mais '+(hits.length-40)+' resultados. Refine a busca.<\/p>':'');
  res.classList.add('aberto');
}
inp.addEventListener('input',()=>{clearTimeout(tm);tm=setTimeout(buscar,140);});
inp.addEventListener('focus',()=>{if(res.innerHTML)res.classList.add('aberto');});
inp.addEventListener('keydown',e=>{if(e.key==='Escape'){res.classList.remove('aberto');inp.blur();}});
res.addEventListener('click',()=>{res.classList.remove('aberto');});
document.addEventListener('click',e=>{if(!e.target.closest('.busca'))res.classList.remove('aberto');});

/* ───────── pele, fonte e menu ───────── */
const root=document.documentElement;
function pref(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){}return null;}
function setPele(on){if(on)root.setAttribute('data-pele','pergaminho');else root.removeAttribute('data-pele');$('#b-pele').setAttribute('aria-pressed',on);}
function setFonte(on){if(on)root.setAttribute('data-fonte','dys');else root.removeAttribute('data-fonte');$('#b-fonte').setAttribute('aria-pressed',on);}
setPele(pref('rmv-pele')==='1');setFonte(pref('rmv-fonte')==='1');
$('#b-pele').addEventListener('click',()=>{const on=root.getAttribute('data-pele')!=='pergaminho';setPele(on);pref('rmv-pele',on?'1':'0');});
$('#b-fonte').addEventListener('click',()=>{const on=root.getAttribute('data-fonte')!=='dys';setFonte(on);pref('rmv-fonte',on?'1':'0');});
$('#b-fonte').title='Troca a fonte do texto para OpenDyslexic, se instalada neste aparelho, ou Lexend';
$('#b-menu').addEventListener('click',()=>{const o=$('#lombada').classList.toggle('aberta');$('#b-menu').setAttribute('aria-expanded',o);});

/* ───────── partida ───────── */
$('#nav').innerHTML=D.sec.map(s=>'<a href="#'+s[0]+'" data-go="'+s[0]+'"><span class="em">'+s[1]+'<\/span><span>'+s[2]+'<\/span><\/a>').join('');
buildNodes();buildIndex();
/* Edição ilustrada: módulo opcional (assets/edicao-ilustrada.js). Sem ele, ou se ele falhar, nada muda no códice. */
try{if(typeof window.CodiceIlustrado==='function')RV=window.CodiceIlustrado({D,SEC,R,AFTER,NODES,IDX,esc,strip,norm,$,$$,main,inp,res,purl,ligar,go,focoNode,focoInicio,
  ganchos:{get view(){return view;},set view(f){view=f;},get focusEl(){return focusEl;},set focusEl(f){focusEl=f;},get applyMap(){return applyMap;},set applyMap(f){applyMap=f;}}})||null;}
catch(e){RV=null;try{console.warn('Edição ilustrada indisponível; o códice segue no modo texto.',e);}catch(_){}}
route();
})();

</script>
